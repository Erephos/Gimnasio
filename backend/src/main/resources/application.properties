spring.application.name=backend

# Perfil "local": hace que Spring tambien cargue application-local.properties
# (archivo con las credenciales, gitignoreado). En produccion se usaria otro perfil.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Base de datos ---
# Driver JDBC de PostgreSQL (lo trae la dependencia 'postgresql' del pom.xml)
spring.datasource.driver-class-name=org.postgresql.Driver

# MUY IMPORTANTE: "validate" le dice a JPA/Hibernate que NO cree ni modifique tablas,
# solo VERIFIQUE que tus entidades coinciden con las que ya existen en Neon.
# Tu SQL es la unica fuente de verdad del esquema.
spring.jpa.hibernate.ddl-auto=validate

# Desactiva el "Open Session in View": evita consultas a la BD sorpresivas
# desde la capa web. Buena practica desde el dia uno.
spring.jpa.open-in-view=false

# Tus tablas viven en el esquema "gimnasio" (no en "public"), asi se lo
# indicamos a Hibernate para que valide y consulte las tablas correctas
spring.jpa.properties.hibernate.default_schema=gimnasio

# Muestra en consola el SQL que Hibernate genera (ideal para APRENDER; lo
# apagaremos cuando el sistema este maduro)
spring.jpa.show-sql=true

app.jwt.expiration-ms=28800000

# Recuperacion por correo. Configurar app.mail.enabled=true y las propiedades
# spring.mail.* en variables de entorno para habilitar el envio.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@gimnasio.local}
app.mail.reset-url=${APP_MAIL_RESET_URL:http://localhost:5173/restablecer}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
