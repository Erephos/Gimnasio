spring.application.name=backend

# Perfil "local": hace que Spring tambien cargue application-local.properties
# (archivo con las credenciales, gitignoreado). En produccion se usaria otro perfil.
spring.profiles.active=local

# --- Base de datos ---
# Driver JDBC de PostgreSQL (lo trae la dependencia 'postgresql' del pom.xml)
spring.datasource.driver-class-name=org.postgresql.Driver

# MUY IMPORTANTE: "validate" le dice a JPA/Hibernate que NO cree ni modifique tablas,
# solo VERIFIQUE que tus entidades coinciden con las que ya existen en Neon.
# Tu SQL es la unica fuente de verdad del esquema.
spring.jpa.hibernate.ddl-auto=validate

# Desactiva el "Open Session in View": evita consultas a la BD sorpresivas
# desde la capa web. Buena practica desde el dia uno.
spring.jpa.open-in-view=false

# Tus tablas viven en el esquema "gimnasio" (no en "public"), asi se lo
# indicamos a Hibernate para que valide y consulte las tablas correctas
spring.jpa.properties.hibernate.default_schema=gimnasio

# Muestra en consola el SQL que Hibernate genera (ideal para APRENDER; lo
# apagaremos cuando el sistema este maduro)
spring.jpa.show-sql=true

app.jwt.expiration-ms=28800000